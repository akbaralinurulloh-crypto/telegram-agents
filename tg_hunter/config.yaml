timezone: Asia/Tashkent
report_times: ["08:00", "13:00", "20:00"]

channel_topic: |
  QORALAMA (kanallarning nomidan taxmin qilingan; tasdiqlang yoki tahrir qiling):
  Kanal: @muhtashamtraveluzz — umra, haj va ziyorat safarlari haqida.
  Yaxshi post: umra/haj/ziyorat bo'yicha foydali ma'lumot (qoidalar, hujjatlar, vizalar, yo'l-yo'riq,
  Makka/Madina haqida amaliy maslahat), safar tajribasi, ziyorat joylari tasviri, safar tayyorgarligi,
  yangiliklar (parvozlar, viza qoidalari o'zgarishi), sifatli rasm va videolar.
  Yomon post: safarga aloqasi yo'q kontent, boshqa kompaniyalarning reklamasi va narxlari,
  siyosat, tasdiqlanmagan mish-mish, sifatsiz yoki takroriy media, boshqa kanalga chaqiruv.
  Auditoriya: umra va ziyoratga borishni rejalashtirayotgan yoki borib kelgan o'zbek tilli odamlar.

scoring:
  min_score: 7.0
  weights:            # yig'indisi 1.0 bo'lishi shart
    topic_fit: 0.30
    quality: 0.25
    audience_interest: 0.25
    media_quality: 0.20

watcher:
  catch_up: true      # o'chiq turgan vaqtdagi xabarlarni ham olish (Telethon catch_up)

caption:
  max_length: 1024
  max_attempts: 2

# Q2: izohda bo'lmasligi shart bo'lgan kalit so'zlar (kichik harf, lotin+kirill)
banned_caption_keywords:
  - hadis
  - hadith
  - rivoyat
  - sahih
  - sanad
  - s.a.v
  - alayhissalom
  - payg'ambar
  - paygambar
  - хадис
  - ривоят
  - саҳиҳ
  - санад
  - алайҳиссалом
  - пайғамбар

kill_switch:
  max_consecutive_errors: 5

llm:
  provider: gemini            # gemini | anthropic
  gemini_model: gemini-3.5-flash
  gemini_fallback_models: [gemini-3.8-flash, gemini-flash-latest]   # asosiy model band bo'lsa shularga o'tadi
  anthropic_model: claude-sonnet-5-5
  max_images: 6               # bitta so'rovga maks. rasm/kadr soni
  timeout_seconds: 90
  max_retries: 3
