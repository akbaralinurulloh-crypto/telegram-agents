# TG Hunter: Render BEPUL reja (sinov rejimi). Karta kerak emas, lekin juda cheklangan:
# 0.1 CPU, 512 MB, disk vaqtinchalik, 15 daqiqada uxlaydi (agent o'zini har 10 daqiqada uyg'otadi).
# Yengil rejim config.free.yaml da: faqat Tesseract, videolar qo'lda ko'rib chiqishga o'tadi, baza qayta ishga tushganda o'chadi.
# Faqat SINOV (DRY-RUN) uchun. Jonli ishlash uchun render.paid.yaml (Standard + disk) yoki VPS.
# Bu faylda SIRLAR YO'Q: `sync: false` degani qiymatni Render panelida (Environment) o'zingiz kiritasiz.
services:
  - type: web
    name: tg-hunter
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./tg_hunter/Dockerfile
    dockerContext: ./tg_hunter
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths:
        - tg_hunter/**          # repo ildizidagi boshqa fayllar o'zgarsa, agent qayta qurilmasin
    envVars:
      - key: CONFIG_PATH
        value: config.free.yaml
      - key: TG_API_ID
        sync: false
      - key: TG_API_HASH
        sync: false
      - key: TG_SESSION_STRING
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: TARGET_CHANNEL
        sync: false
      - key: SOURCE_CHANNELS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DRY_RUN
        sync: false
