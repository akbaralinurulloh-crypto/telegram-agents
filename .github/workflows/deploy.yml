name: Deploy TG Hunter

# Faqat repoda  Settings -> Variables -> DEPLOY_ENABLED = true  bo'lganda ishlaydi.
# Secrets: SERVER_HOST, SERVER_USER, SERVER_SSH_KEY (serverga kirish uchun alohida kalit).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tg_hunter/**"]

concurrency: deploy-hunter

jobs:
  deploy:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Serverda yangilash
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER_NAME: ${{ secrets.SERVER_USER }}
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new "$USER_NAME@$HOST" \
            "cd /opt/telegram-agents/tg_hunter && bash deploy/update.sh"
